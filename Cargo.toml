[package]
name = "canaima-updater"
version = "0.1.0"
edition = "2021"
authors = ["Canaima GNU/Linux Team"]
description = "Módulo de actualización automática con interfaz nativa GTK y elevación segura con pkexec para Canaima GNU/Linux"
license = "GPL-3.0-only"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
gdk-pixbuf = "0.18"

